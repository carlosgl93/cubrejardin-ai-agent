[pytest]
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
markers =
    integration: marks integration-oriented tests
    e2e: marks end-to-end tests (requires running services)

# Run unit tests by default (exclude e2e)
# Use: pytest -m e2e to run E2E tests
# Use: pytest -m "not e2e" to run only unit tests
filterwarnings =
    ignore::DeprecationWarning

