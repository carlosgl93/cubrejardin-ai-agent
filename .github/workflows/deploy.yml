name: Deploy Backend to Cloud Run

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build & deploy via Cloud Build
        run: |
          gcloud builds submit \
            --config cloudbuild.yaml \
            --project sg-cloud-cefee \
            --suppress-logs

      - name: Apply environment variables
        run: |
          printf '%s' "$ENV_PROD_YAML" > /tmp/env.prod.yaml
          gcloud run services update whatsapp-api \
            --region us-central1 \
            --env-vars-file /tmp/env.prod.yaml \
            --project sg-cloud-cefee
          rm /tmp/env.prod.yaml

          EXTRA_VARS="INSTAGRAM_PAGE_ID=1028203907040559,INSTAGRAM_IG_USER_ID=17841403976567314"
          if [ -n "$RESEND_API_KEY" ]; then
            EXTRA_VARS="${EXTRA_VARS},RESEND_API_KEY=${RESEND_API_KEY}"
          fi
          if [ -n "$RESEND_FROM_EMAIL" ]; then
            EXTRA_VARS="${EXTRA_VARS},RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}"
          fi
          gcloud run services update whatsapp-api \
            --region us-central1 \
            --update-env-vars="${EXTRA_VARS}" \
            --project sg-cloud-cefee
        env:
          ENV_PROD_YAML: ${{ secrets.ENV_PROD_YAML }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
